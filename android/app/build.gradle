plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   // id "com.google.gms.google-services"  // Disabled: google-services.json needs to match br.com.stepout.aluno

}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "br.com.stepout.aluno.app"
    // Alinhado com o exemplo oficial do jitsi_meet_flutter_sdk (compileSdk 35).
    // compileSdk 36 (API 36) está associado ao bug de câmera mutada que não
    // liga no Android — ver Jitsi issue #16191.
    compileSdkVersion 35
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "br.com.stepout.aluno.app"
        minSdkVersion 26
        // targetSdk 35 = exigência da Play. A câmera foi confirmada no 34; o 35
        // deve manter (o bug de câmera estava no 36/API 36 — ver issue #16191),
        // mas reconfirmar a câmera num APK targetSdk 35 antes de subir o AAB.
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            // Câmera Android (Jitsi/react-native-webrtc): o R8 estava renomeando e
            // removendo as classes de captura de vídeo de `com.oney.WebRTCModule.*`
            // (acionadas por reflexão pela ponte React Native), deixando a câmera
            // preta SÓ no release Android (iOS/web não passam por R8). Desligar a
            // minificação resolve e ainda evita o mesmo risco em outros plugins de
            // reflexão (Supabase, GoTrue, video_player). Ver análise completa.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

configurations.all {
    // Resolve duplicate media3 classes between video_player and Jitsi SDK
    exclude group: 'androidx.media3', module: 'media3-exoplayer-rtsp'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
}
